version: 2
updates:
  # Enable version updates for npm/bun dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 10
    ignore:
      # These tools are pinned to the versions nixpkgs provides (see the
      # update-nixpkgs flow); bump them by updating the nix flake, not here.
      - dependency-name: "@biomejs/biome"
      - dependency-name: "turbo"
      - dependency-name: "typescript"
      # Kept in lockstep with the nix-pinned turbo version.
      - dependency-name: "eslint-config-turbo"
    groups:
      # Group all non-major updates together
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
